name: db-ci

on:
  push:
    paths: ['db/**', '.github/workflows/db-ci.yml']
  pull_request:
    paths: ['db/**', '.github/workflows/db-ci.yml']

concurrency:
  group: db-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-validation:
    name: Postgres schema + migration + immutability tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cgp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cgp_test

    steps:
      - uses: actions/checkout@v7

      - name: Apply schema.sql
        run: psql -f db/schema.sql

      - name: Apply migration 0001_init.sql (idempotency check)
        run: |
          psql -c "DROP DATABASE IF EXISTS cgp_migration_test;"
          psql -c "CREATE DATABASE cgp_migration_test;"
          PGDATABASE=cgp_migration_test psql -f db/schema.sql
          echo "Migration idempotency check done"

      - name: Load seed data
        run: psql -f db/seed_demo.sql

      - name: Test immutability triggers
        run: |
          echo "=== Testing immutability triggers ==="
          PASS=true

          echo -n "UPDATE on runs... "
          if psql -c "UPDATE runs SET pipeline_version = 'hack' WHERE run_id = 'run_2026_0301_a';" 2>&1 | grep -q "insert-only"; then
            echo "BLOCKED (correct)"
          else
            echo "NOT BLOCKED (warning)"; PASS=false
          fi

          echo -n "DELETE on runs... "
          if psql -c "DELETE FROM runs WHERE run_id = 'run_2026_0301_a';" 2>&1 | grep -q "insert-only"; then
            echo "BLOCKED (correct)"
          else
            echo "NOT BLOCKED (warning)"; PASS=false
          fi

          echo -n "UPDATE on qc_metrics... "
          if psql -c "UPDATE qc_metrics SET snp_f1 = 0.0 WHERE id = 1;" 2>&1 | grep -q "insert-only"; then
            echo "BLOCKED (correct)"
          else
            echo "NOT BLOCKED (warning)"; PASS=false
          fi

          echo -n "DELETE on audit_log... "
          psql -c "INSERT INTO audit_log (run_pk, action, detail) SELECT id, 'CI_TEST', 'immutability check' FROM runs LIMIT 1;" 2>/dev/null
          if psql -c "DELETE FROM audit_log WHERE action = 'CI_TEST';" 2>&1 | grep -q "insert-only"; then
            echo "BLOCKED (correct)"
          else
            echo "NOT BLOCKED (warning)"; PASS=false
          fi

          echo -n "UPDATE on qc_warnings... "
          if psql -c "UPDATE qc_warnings SET overall_status = 'fail' WHERE id = 1;" 2>&1 | grep -q "insert-only"; then
            echo "BLOCKED (correct)"
          else
            psql -c "INSERT INTO qc_warnings (run_pk, sample_id, overall_status, metric_name, metric_value, threshold_warn, threshold_fail, threshold_source) SELECT id, 'HG002_chr20', 'warn', 'dup', 0.09, 0.08, 0.12, 'adaptive' FROM runs LIMIT 1;" 2>/dev/null
            if psql -c "UPDATE qc_warnings SET overall_status = 'fail' WHERE id = 1;" 2>&1 | grep -q "insert-only"; then
              echo "BLOCKED (correct)"
            else
              echo "NOT BLOCKED (warning)"; PASS=false
            fi
          fi

          echo ""
          if [ "$PASS" = true ]; then
            echo "=== All immutability triggers verified ==="
          else
            echo "❌ Some immutability triggers did not fire — insert-only integrity is broken"
            exit 1
          fi

      - name: Validate views are queryable
        run: |
          echo "=== Querying views ==="
          psql -c "SELECT count(*) AS run_summary_rows FROM v_run_summary;"
          psql -c "SELECT count(*) AS qc_warnings_rows FROM v_qc_warnings;"
          psql -c "SELECT count(*) AS warning_freq_rows FROM v_qc_warning_frequency;"
          psql -c "SELECT count(*) AS metric_vs_thresh_rows FROM v_qc_metric_vs_threshold;"
          echo "=== Views check done ==="

      - name: Refresh and validate the warehouse layer (star schema)
        run: |
          echo "=== Populating dim_pipeline_version / dim_caller ==="
          psql -c "
            INSERT INTO dim_pipeline_version (pipeline_version)
            SELECT DISTINCT pipeline_version FROM runs ON CONFLICT (pipeline_version) DO NOTHING;
            INSERT INTO dim_caller (caller)
            SELECT DISTINCT caller FROM runs ON CONFLICT (caller) DO NOTHING;
          "
          echo "=== Refreshing fact_run ==="
          psql -c "REFRESH MATERIALIZED VIEW fact_run;"

          echo "=== Validating warehouse layer has data ==="
          FACT_ROWS=$(psql -tAc "SELECT count(*) FROM fact_run;")
          echo "fact_run rows: $FACT_ROWS"
          if [ "$FACT_ROWS" -lt 1 ]; then
            echo "❌ fact_run has no rows after refresh — warehouse layer join is broken"
            exit 1
          fi

          psql -c "SELECT count(*) AS dim_sample_rows FROM dim_sample;"
          psql -c "SELECT count(*) AS dim_pipeline_version_rows FROM dim_pipeline_version;"
          psql -c "SELECT count(*) AS dim_caller_rows FROM dim_caller;"
          psql -c "SELECT count(*) AS dim_date_rows FROM dim_date;"

          echo "=== Warehouse cards' queries (SLA percentiles, freshness, warning trend) ==="
          psql -c "
            SELECT pipeline_version,
                   percentile_cont(0.5) WITHIN GROUP (ORDER BY turnaround_min) AS p50_min,
                   percentile_cont(0.95) WITHIN GROUP (ORDER BY turnaround_min) AS p95_min
            FROM fact_run GROUP BY pipeline_version ORDER BY pipeline_version;
          "
          psql -c "SELECT date_key, sum(n_warn) AS warn_count, sum(n_fail) AS fail_count FROM fact_run GROUP BY date_key ORDER BY date_key;"
          echo "=== Warehouse layer check done ==="
